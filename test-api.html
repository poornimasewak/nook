<!DOCTYPE html>
<html>
<head>
    <title>Test Nook API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        input, button {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
        }
        button {
            background: #14b8a6;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 8px;
        }
        button:hover {
            background: #0d9488;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            white-space: pre-wrap;
        }
        .success {
            background: #d1fae5;
            border: 1px solid #10b981;
        }
        .error {
            background: #fee2e2;
            border: 1px solid #ef4444;
        }
    </style>
</head>
<body>
    <h1>🧪 Test Nook API</h1>
    <p>Test your deployed API endpoint</p>

    <label>Vercel URL:</label>
    <input type="text" id="baseUrl" placeholder="https://your-app.vercel.app" value="">

    <label>Email:</label>
    <input type="email" id="email" placeholder="test@example.com" value="test@example.com">

    <label>Full Name:</label>
    <input type="text" id="fullName" placeholder="Test User" value="Test User">

    <button onclick="testAPI()">🚀 Send OTP Request</button>

    <div id="result"></div>

    <script>
        async function testAPI() {
            const baseUrl = document.getElementById('baseUrl').value.trim();
            const email = document.getElementById('email').value;
            const fullName = document.getElementById('fullName').value;
            const resultDiv = document.getElementById('result');

            if (!baseUrl) {
                resultDiv.className = 'error';
                resultDiv.textContent = '❌ Please enter your Vercel URL';
                return;
            }

            resultDiv.textContent = '⏳ Sending request...';
            resultDiv.className = '';

            try {
                const apiUrl = `${baseUrl}/api/auth/send-email-otp`;
                console.log('Testing:', apiUrl);

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, fullName }),
                });

                const data = await response.json();

                console.log('Response:', response.status, data);

                if (response.ok) {
                    resultDiv.className = 'success';
                    resultDiv.textContent = `✅ Success!\n\nStatus: ${response.status}\n\nResponse:\n${JSON.stringify(data, null, 2)}\n\n📧 Check your Vercel logs for the OTP code!`;
                } else {
                    resultDiv.className = 'error';
                    resultDiv.textContent = `❌ Error\n\nStatus: ${response.status}\n\nResponse:\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.textContent = `❌ Request Failed\n\nError: ${error.message}\n\nPossible issues:\n- API route doesn't exist\n- CORS issue\n- Network error\n- Wrong URL`;
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
